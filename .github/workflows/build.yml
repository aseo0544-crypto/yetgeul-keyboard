name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Engine tests (plain Java)
        run: |
          mkdir -p /tmp/et
          javac -encoding UTF-8 -d /tmp/et app/src/main/java/com/yetgeul/keyboard/engine/*.java engine-test/*.java
          java -cp /tmp/et EngineTest
          java -cp /tmp/et SessionTest

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk yetgeul-keyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yetgeul-keyboard-apk
          path: yetgeul-keyboard.apk

      - name: Publish "latest" release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest yetgeul-keyboard.apk --title "옛글 키보드 최신 빌드" --notes "main 브랜치 최신 커밋으로 자동 빌드한 APK입니다. 휴대폰에서 받아 설치하세요." --prerelease

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate PC script
        run: python windows/gen.py

      - name: Self-test in Windows PowerShell 5.1
        shell: powershell
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          powershell -NoProfile -ExecutionPolicy Bypass -File "windows\옛글키보드.ps1" -SelfTest

      - name: Attach to "latest" release (main only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "windows/옛글키보드.ps1" yetgeul-keyboard-pc.ps1
          gh release upload latest yetgeul-keyboard-pc.ps1 --clobber
