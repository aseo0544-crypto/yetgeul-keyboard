plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yetgeul.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yetgeul.keyboard'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 따로 서명 키가 없으면 디버그 키로 서명해서 바로 설치할 수 있게 함
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'ttf'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
