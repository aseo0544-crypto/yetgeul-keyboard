plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yetgeul.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yetgeul.keyboard'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '0.4.0'
    }

    // 고정 서명 키: CI가 GitHub 비밀값 YETGEUL_KEYSTORE에서 풀어 놓음. 없으면 디버그 키 (빌드마다 바뀌어 덮어 설치가 안 됨)
    def ks = file('yetgeul.jks')
    signingConfigs {
        fixed {
            storeFile ks
            storePassword System.getenv('YETGEUL_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'yetgeul'
            keyPassword System.getenv('YETGEUL_KEYSTORE_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks.exists() ? signingConfigs.fixed : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'ttf'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
